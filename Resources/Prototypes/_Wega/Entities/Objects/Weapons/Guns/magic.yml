- type: entity
  parent: BaseItem
  id: HandTelekinesisGun
  name: hand
  description: ""
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/magic_hand.rsi
    state: icon
    color: "#ed760e"
  - type: DeleteOnDrop
  - type: Item
    size: Ginormous
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#ed760e"
      right:
      - state: inhand-right
        color: "#ed760e"
  - type: TetherGun
    frequency: 5
    dampingRatio: 4
  - type: EdibleMatter
    canBeEaten: false
  - type: ItemToggle
    onUse: false
    
- type: entity
  parent: BaseEnchantable
  id: WeaponVeilCultCrossbowBasic
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Basic/brass_crossbow.rsi
  - type: Item
    sprite: _Wega/Objects/Weapons/Guns/Basic/brass_crossbow.rsi
    size: Ginormous
  - type: Clothing
    slots:
    - back
  - type: Gun
    fireRate: 0.5 # You need some time to prepare your shot
    selectedMode: SemiAuto
    minAngle: 0
    maxAngle: 1
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 4 #2 seconds of KD, should always have CD > KD
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/energycrossbow_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: EnergyArrow
    capacity: 1
    count: 1
  - type: MultiHandedItem
  - type: Enchantable
    enchants:
    - WeaponVeilCultCrossbowLifesteal
    - WeaponVeilCultCrossbowAnnihilation
    - WeaponVeilCultCrossbowTripleShot
  - type: Tag
    tags:
    - VeilWeapon
  - type: CultAllowedGun
  
- type: entity
